name: Bootstrap project
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        run: |
          mkdir -p /tmp/project
          base64 -d project.b64 > /tmp/project.tgz
          tar -xzf /tmp/project.tgz -C /tmp/project --strip-components=1
          cp -a /tmp/project/. .
          rm -f project.b64
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: mount hackathon project' || exit 0
          git push
